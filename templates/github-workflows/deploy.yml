name: Deploy to GitHub Pages

# Trigger on every push to main, plus a manual dispatch button in the
# Actions tab so you can re-deploy without changing files.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One concurrent deploy at a time; let the in-flight one finish so the
# Pages environment doesn't get into a half-deployed state.
concurrency:
  group: pages
  cancel-in-progress: false

# Pages-specific permissions only; everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site is plain static HTML/CSS/JS — no build step. Upload the
      # whole repo (course PDFs are git-ignored, so they never reach
      # GitHub anyway).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
